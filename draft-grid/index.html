<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2 Serpentine Draft Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: status bar with the team on the clock, the teams-by-rounds grid (scrolls sideways on a phone), then the player picker. */
:root{
  --bg:#f4f2ee; --panel:#ffffff; --ink:#1d2430; --muted:#5d6675; --line:#d9d5cc;
  --accent:#c4541a; --accent-ink:#ffffff; --clock-bg:#fde6d6;
  --ok:#1f7a4d; --bad:#a23b3b; --chip:#ebe7df;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#14171c; --panel:#1e232b; --ink:#eef0f3; --muted:#a3acb9; --line:#343b47;
    --accent:#f08a4b; --accent-ink:#1a120b; --clock-bg:#4a2c17;
    --ok:#5fd197; --bad:#f08d8d; --chip:#2a303a;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#14171c; --panel:#1e232b; --ink:#eef0f3; --muted:#a3acb9; --line:#343b47;
  --accent:#f08a4b; --accent-ink:#1a120b; --clock-bg:#4a2c17;
  --ok:#5fd197; --bad:#f08d8d; --chip:#2a303a;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 60px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-family:var(--display);font-weight:700;font-size:26px;margin:14px 0 2px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:14px;margin:0 0 10px}
.clock{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.clock .who{flex:1;min-width:200px}
.clock .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.clock .team{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:600}
.btn[disabled]{opacity:.4}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:var(--bad)}
.gridbox{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:14px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:left;vertical-align:middle}
tr:last-child td{border-bottom:0} th:last-child,td:last-child{border-right:0}
thead th{font-family:var(--display);font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px;text-align:center;background:var(--chip)}
td.tm{padding:4px 6px;white-space:nowrap;width:150px;background:var(--panel);position:sticky;left:0;z-index:1}
td.tm b{font-family:var(--display);font-size:18px;display:inline-block;width:22px}
td.tm input{width:104px;min-height:34px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:0 6px}
.cell{display:block;width:100%;min-height:46px;padding:4px 6px;text-align:left;font-size:13.5px;line-height:1.2}
.cell .n{font-weight:600;display:block}
.cell .e{color:var(--muted);font-size:12px}
.cell.empty{color:var(--muted)}
td.sel .cell{background:var(--clock-bg);box-shadow:inset 0 0 0 2px var(--accent)}
.pick{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.pick h2{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--muted)}
.search{width:100%;min-height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:17px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.p{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:46px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:left;width:100%}
.p .n{font-weight:600}
.p .e{color:var(--muted);font-size:13px;white-space:nowrap}
.p .ck{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:9px;background:var(--chip);margin-left:6px}
.note{color:var(--muted);font-size:14px}
.msg{font-weight:600;color:var(--ok)} .msg.bad{color:var(--bad)}
.foot{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot .sp{flex:1}
#sync{color:var(--muted);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>B2 Serpentine Draft Grid</h1>
  <p class="sub">CYB 2026-27 · 10 teams · tap a player to give him to the team on the clock, or tap any square first to fill that one.</p>
  <div class="clock">
    <div class="who"><div class="eyebrow" id="ckEyebrow">On the clock</div><div class="team" id="ckTeam">Team 1</div></div>
    <button class="btn" id="undo" type="button">Undo</button>
    <button class="btn" id="clear" type="button">Clear square</button>
  </div>
  <div class="gridbox"><table id="grid"></table></div>
  <div class="pick">
    <h2 id="poolTitle">Players left</h2>
    <input class="search" id="q" type="search" autocomplete="off" placeholder="Search name or eval number">
    <div class="players" id="players"></div>
  </div>
  <div class="foot">
    <button class="btn pri" id="xlsx" type="button">Download Excel grid</button>
    <button class="btn" id="copy" type="button">Copy grid as text</button>
    <button class="btn" id="r10" type="button">Add round 10</button>
    <span class="sp"></span>
    <button class="btn warn" id="reset" type="button">Reset grid</button>
  </div>
  <p class="msg" id="msg" role="status"></p>
  <p id="sync">This grid is saved on this device. Each person who opens the page keeps a separate grid.</p>
</div>

<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById("data").textContent), P=D.players, byId={};
P.forEach(function(p){byId[p.id]=p;});
var TEAMS=10, KEY="b2grid.v1";
function blank(){return {coach:["","","","","","","","","",""],cells:{},rounds:9,h:[],t:0};}
var st=blank();
try{var raw=localStorage.getItem(KEY); if(raw){var o=JSON.parse(raw); if(o&&o.cells){st=o; st.h=st.h||[];}}}catch(e){}
var sel=null, query="", resetArmed=false;
function $(id){return document.getElementById(id);}
function el(tag,cls,txt){var e=document.createElement(tag); if(cls) e.className=cls; if(txt!==undefined&&txt!==null) e.textContent=txt; return e;}
function key(r,t){return r+"-"+t;}
function order(){var o=[]; for(var r=1;r<=st.rounds;r++){ for(var i=1;i<=TEAMS;i++){ o.push([r,(r%2)?i:TEAMS+1-i]); } } return o;}
function onClock(){var o=order(); for(var i=0;i<o.length;i++){ if(!st.cells[key(o[i][0],o[i][1])]) return {r:o[i][0],t:o[i][1],n:i+1}; } return null;}
function target(){ if(sel) return sel; return onClock(); }
function drafted(){var d={}; Object.keys(st.cells).forEach(function(k){d[st.cells[k]]=k;}); return d;}
function teamName(t){return "Team "+t+(st.coach[t-1]?" · "+st.coach[t-1]:"");}
function say(s,bad){var m=$("msg"); m.textContent=s; m.className="msg"+(bad?" bad":"");}

/* ---------- saving: this device, plus the signed-in viewer's own private copy ---------- */
var ref=null, writing=false, dirty=false;
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function save(){st.t=Date.now(); saveLocal(); push();}
function push(){
  if(!ref) return;
  if(writing){dirty=true; return;}
  writing=true;
  ref.set({j:JSON.stringify(st),t:st.t}).then(function(){$("sync").textContent="This grid is saved to your account and on this device. Each person who opens the page keeps a separate grid.";},function(){}).then(function(){writing=false; if(dirty){dirty=false; push();}});
}
function startSync(){
  if(!(window.claude&&typeof window.claude.use==="function")) return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(a){
    var db=a[0], user=a[1]; if(!db||!user) return;
    return user.id().then(function(uid){
      if(!uid) return;
      ref=db.doc("data/users/"+uid+"/grid");
      var first=true;
      ref.onSnapshot(function(snap){
        var d=snap.exists?snap.data():null, wasFirst=first; first=false;
        if(d&&typeof d.j==="string"&&d.t>st.t){ try{var o=JSON.parse(d.j); if(o&&o.cells){st=o; st.h=st.h||[]; saveLocal(); render();}}catch(e){} }
        else if(wasFirst&&st.t&&(!d||d.t<st.t)){push();}
      },function(){});
    });
  }).catch(function(){});
}

/* ---------- actions ---------- */
function assign(pid){
  var tg=target(); if(!tg){say("Every square is full. Add round 10 or clear a square first.",true); return;}
  var k=key(tg.r,tg.t), was=st.cells[k]||null, d=drafted();
  if(d[pid]){say(byId[pid].n+" is already on the grid.",true); return;}
  st.h.push([k,was]); if(st.h.length>60) st.h.shift();
  st.cells[k]=pid; sel=null; query=""; $("q").value="";
  say(byId[pid].n+" to "+teamName(tg.t)+", round "+tg.r+".");
  save(); render();
}
function clearSel(){ if(!sel) return; var k=key(sel.r,sel.t); if(!st.cells[k]) return; st.h.push([k,st.cells[k]]); delete st.cells[k]; say("Square cleared."); save(); render(); }
function undo(){var x=st.h.pop(); if(!x) return; if(x[1]) st.cells[x[0]]=x[1]; else delete st.cells[x[0]]; sel=null; say("Undone."); save(); render();}

/* ---------- export ---------- */
function gridRows(){
  var rows=[["Team","Coach"].concat(Array.from({length:st.rounds},function(_,i){return "Round "+(i+1);}))];
  for(var t=1;t<=TEAMS;t++){ var r=[t,st.coach[t-1]||""]; for(var c=1;c<=st.rounds;c++){ var id=st.cells[key(c,t)]; r.push(id?byId[id].n+" (#"+id+")":""); } rows.push(r); }
  return rows;
}
function b64buf(s){var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u.buffer;}
function fillWorkbook(wb){
  var g=wb.getWorksheet("Draft Grid"), n=wb.getWorksheet("Draft Results with Name");
  for(var t=1;t<=TEAMS;t++){
    g.getCell(4+t,1).value=st.coach[t-1]||null;
    n.getCell(3+t,1).value="Team "+t+(st.coach[t-1]?" - "+st.coach[t-1]:"");
    for(var r=1;r<=st.rounds;r++){
      var id=st.cells[key(r,t)], p=id?byId[id]:null;
      g.getCell(4+t,2+r).value=p?(/^\d+$/.test(id)?Number(id):id):null;
      n.getCell(3+t,1+r).value=p?p.n:null;
    }
  }
  if(st.rounds>9){ g.getCell(3,12).value=10; g.getCell(3,12).font={bold:true}; }
  return wb;
}
window.__fillWorkbook=fillWorkbook;
function exportXlsx(){
  if(typeof ExcelJS==="undefined"){say("The Excel builder did not load. Check your connection and reload, or use Copy grid as text.",true); return;}
  say("Building the file...");
  var wb=new ExcelJS.Workbook();
  wb.xlsx.load(b64buf(D.template)).then(function(){
    fillWorkbook(wb);
    return wb.xlsx.writeBuffer();
  }).then(function(buf){
    var url=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    var a=document.createElement("a"); a.href=url; a.download="B2 Serpentine Draft Grid.xlsx"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
    say("Excel grid downloaded.");
  },function(){say("Could not build the file. Use Copy grid as text and paste it into Excel.",true);});
}
function copyText(){
  var txt=gridRows().map(function(r){return r.join("\t");}).join("\n");
  try{ navigator.clipboard.writeText(txt).then(function(){say("Grid copied. Paste it into Excel or Sheets.");},function(){say("Copying is blocked in this view.",true);}); }catch(e){say("Copying is blocked in this view.",true);}
}

/* ---------- rendering ---------- */
function render(){
  var oc=onClock(), tg=target(), d=drafted();
  if(sel){ $("ckEyebrow").textContent="Filling the square you tapped"; $("ckTeam").textContent=teamName(sel.t)+" · round "+sel.r; }
  else if(oc){ $("ckEyebrow").textContent="On the clock · pick "+oc.n+" · round "+oc.r; $("ckTeam").textContent=teamName(oc.t); }
  else { $("ckEyebrow").textContent="Draft complete"; $("ckTeam").textContent="Every square is full"; }
  $("undo").disabled=!st.h.length;
  $("clear").disabled=!(sel&&st.cells[key(sel.r,sel.t)]);
  $("r10").textContent=st.rounds>9?"Remove round 10":"Add round 10";
  $("reset").textContent=resetArmed?"Tap again to erase the grid":"Reset grid";
  var tb=$("grid"); tb.textContent="";
  var th=el("thead"), hr=el("tr"); hr.appendChild(el("th",null,"Team / coach"));
  for(var r=1;r<=st.rounds;r++) hr.appendChild(el("th",null,"R"+r+(r%2?" ↓":" ↑")));
  th.appendChild(hr); tb.appendChild(th);
  var body=el("tbody");
  for(var t=1;t<=TEAMS;t++){ (function(t){
    var tr=el("tr"), tm=el("td","tm"); tm.appendChild(el("b",null,t));
    var inp=el("input"); inp.type="text"; inp.id="coach"+t; inp.placeholder="Coach"; inp.value=st.coach[t-1]||""; inp.setAttribute("aria-label","Coach of team "+t);
    inp.addEventListener("change",function(){st.coach[t-1]=inp.value.trim(); save(); render();});
    tm.appendChild(inp); tr.appendChild(tm);
    for(var r=1;r<=st.rounds;r++){ (function(r){
      var id=st.cells[key(r,t)], td=el("td"), b=el("button","cell"+(id?"":" empty")); b.type="button";
      if(tg&&tg.r===r&&tg.t===t) td.className="sel";
      if(id){ b.appendChild(el("span","n",byId[id].n)); b.appendChild(el("span","e","#"+id)); } else b.textContent=(oc&&oc.r===r&&oc.t===t)?"on the clock":"";
      b.setAttribute("aria-label","Team "+t+" round "+r+(id?": "+byId[id].n:": empty"));
      b.addEventListener("click",function(){ sel=(sel&&sel.r===r&&sel.t===t)?null:{r:r,t:t}; render(); });
      td.appendChild(b); tr.appendChild(td);
    })(r); }
    body.appendChild(tr);
  })(t); }
  tb.appendChild(body);
  var q=query.trim().toLowerCase(), left=P.filter(function(p){return !d[p.id];});
  $("poolTitle").textContent="Players left ("+left.length+" of "+P.length+")";
  var box=$("players"); box.textContent="";
  var shown=left.filter(function(p){return !q||p.n.toLowerCase().indexOf(q)>=0||p.id.toLowerCase()===q;});
  if(!shown.length) box.appendChild(el("div","note",q?"No undrafted player matches that.":"Everyone has been drafted."));
  shown.forEach(function(p){
    var b=el("button","p"); b.type="button";
    var l=el("span","n",p.n); if(p.ck) l.appendChild(el("span","ck","Coach's kid"));
    b.appendChild(l); b.appendChild(el("span","e","#"+p.id+(p.g?" · "+p.g:"")));
    b.addEventListener("click",function(){assign(p.id);});
    box.appendChild(b);
  });
}
$("q").addEventListener("input",function(e){query=e.target.value; render();});
$("undo").addEventListener("click",undo);
$("clear").addEventListener("click",clearSel);
$("xlsx").addEventListener("click",exportXlsx);
$("copy").addEventListener("click",copyText);
$("r10").addEventListener("click",function(){
  if(st.rounds>9){ for(var t=1;t<=TEAMS;t++){ if(st.cells[key(10,t)]){say("Clear the round 10 squares before removing the round.",true); return;} } st.rounds=9; } else st.rounds=10;
  sel=null; save(); render();
});
$("reset").addEventListener("click",function(){
  if(!resetArmed){resetArmed=true; render(); setTimeout(function(){resetArmed=false; render();},4000); return;}
  resetArmed=false; var c=st.coach; st=blank(); st.coach=c; sel=null; say("Grid erased. Coach names kept."); save(); render();
});
render();
startSync();
})();
</script>
</body>
</html>
